plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.reconhub'
version = '0.36.0'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    // Montoya API is provided by the Burp runtime -> compileOnly (not bundled).
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'

    // Gson is bundled into the fat-jar via shadowJar.
    implementation 'com.google.code.gson:gson:2.10.1'

    // SnakeYAML: parses YAML-format OpenAPI/Swagger specs (ApiSpecAnalyzer). Loaded with a
    // SafeConstructor (no arbitrary class instantiation) since spec bodies come from the target.
    implementation 'org.yaml:snakeyaml:2.2'

    // Test-only. Note: compileOnly does NOT propagate to testCompileOnly/testRuntimeOnly -- Montoya
    // must be re-declared for both, since it appears in the signatures of most model classes.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
    testRuntimeOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName.set('reconhub')
    archiveClassifier.set('all')
    archiveVersion.set(version)
    // Relocate to avoid clashing with other extensions/Burp internals.
    relocate 'com.google.gson', 'com.reconhub.shaded.gson'
    relocate 'org.yaml.snakeyaml', 'com.reconhub.shaded.snakeyaml'
}

// Make `gradle build` produce the loadable fat-jar.
build.dependsOn shadowJar

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
