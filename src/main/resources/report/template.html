<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReconHub Report</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --line: #2a313b; --fg: #e6e9ee;
    --muted: #9aa4b2; --accent: #4da3ff;
    --high: #ff5c5c; --medium: #ffb020; --low: #4da3ff; --info: #7a8698;
    --maxw: 1200px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* Centered content column shared by header / toolbar / main / footer. */
  .wrap { max-width: var(--maxw); margin: 0 auto; }
  header { padding: 24px 32px; border-bottom: 1px solid var(--line); text-align: center; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); font-size: 13px; }
  /* Sticky toolbar: section jump links on the left, a labeled filter group on the right. */
  nav.toc { position: sticky; top: 0; z-index: 5; background: #12161c;
    border-bottom: 1px solid var(--line); }
  nav.toc .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
    padding: 9px 32px; }
  nav.toc .links { display: flex; flex-wrap: wrap; gap: 14px; }
  nav.toc a { color: var(--muted); text-decoration: none; font-size: 13px; }
  nav.toc a:hover { color: var(--fg); }
  nav.toc .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
    margin-left: auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 12px; }
  nav.toc .filters .fl { text-transform: uppercase; font-size: 11px; letter-spacing: .05em;
    color: var(--muted); font-weight: 600; }
  nav.toc input[type=search] { background: var(--bg); border: 1px solid var(--line);
    color: var(--fg); border-radius: 6px; padding: 5px 10px; font-size: 13px; min-width: 180px; }
  nav.toc label { font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  main { padding: 24px 32px; }
  /* Leave room below the sticky toolbar when jumping to a section via the TOC, so the heading
     (and its collapse toggle) is not hidden underneath it. */
  section { margin-bottom: 36px; scroll-margin-top: 72px; }
  h2 { font-size: 16px; border-left: 3px solid var(--accent); padding-left: 10px; margin: 0 0 14px;
    cursor: pointer; user-select: none; }
  h2::before { content: "\25be"; display: inline-block; width: 14px; color: var(--muted);
    font-size: 12px; }
  section.collapsed h2::before { content: "\25b8"; }
  section.collapsed > *:not(h2) { display: none; }
  .cards { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 18px; min-width: 130px; }
  .card .n { font-size: 24px; font-weight: 700; }
  .card .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .sevsummary { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 8px; }
  .sevsummary .sev { font-size: 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    table-layout: auto; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line);
    vertical-align: top; white-space: normal; overflow-wrap: break-word; word-break: normal; }
  th { background: #1c2129; color: var(--muted); font-weight: 600; font-size: 12px;
    text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr.hidden { display: none; }
  /* Only long opaque tokens/URLs may break mid-"word"; plain text wraps between words. */
  code { font-family: "SF Mono", Consolas, monospace; font-size: 12px; color: #c9d4e3;
    white-space: pre-wrap; word-break: break-all; overflow-wrap: anywhere; }
  /* Findings table: fixed column budget so rows stay aligned and Type reads on few lines.
     Columns: 1 Severity, 2 Category, 3 Type, 4 Value, 5 Location, 6 Evidence, 7 Seen, 8 Status. */
  #findings-table { table-layout: fixed; }
  #findings-table th:nth-child(1), #findings-table td:nth-child(1) { width: 86px; white-space: nowrap; }
  #findings-table th:nth-child(2), #findings-table td:nth-child(2) { width: 92px; white-space: nowrap; }
  #findings-table th:nth-child(3), #findings-table td:nth-child(3) { width: 15%; }
  #findings-table th:nth-child(4), #findings-table td:nth-child(4) { width: 15%; }
  #findings-table th:nth-child(5), #findings-table td:nth-child(5) { width: 18%; }
  #findings-table th:nth-child(7), #findings-table td:nth-child(7) { width: 52px; white-space: nowrap; }
  #findings-table th:nth-child(8), #findings-table td:nth-child(8) { width: 90px; white-space: nowrap; }
  /* Category tag colors. */
  .cat { font-weight: 700; padding: 2px 8px; border-radius: 999px; font-size: 11px;
    white-space: nowrap; }
  .cat.SECRET { background: rgba(255,92,92,.14); color: #ff5c5c; }
  .cat.PII { background: rgba(255,122,184,.14); color: #ff7ab8; }
  .cat.AUTH { background: rgba(197,134,255,.14); color: #c586ff; }
  .cat.MISCONFIG { background: rgba(255,176,32,.14); color: #ffb020; }
  .cat.INFO_LEAK { background: rgba(77,163,255,.14); color: #4da3ff; }
  .cat.API { background: rgba(63,185,80,.14); color: #3fb950; }
  .cat.INJECTION { background: rgba(255,157,77,.14); color: #ff9d4d; }
  .cat.COMMENT, .cat.OTHER { background: rgba(154,164,178,.14); color: #9aa4b2; }
  .sev { font-weight: 700; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
  .sev.HIGH { background: rgba(255,92,92,.15); color: var(--high); }
  .sev.MEDIUM { background: rgba(255,176,32,.15); color: var(--medium); }
  .sev.LOW { background: rgba(77,163,255,.15); color: var(--low); }
  .sev.INFO { background: rgba(122,134,152,.15); color: var(--info); }
  .bar { height: 8px; background: var(--accent); border-radius: 4px; }
  .barrow { display: grid; grid-template-columns: 160px 1fr 60px; gap: 10px;
    align-items: center; margin-bottom: 6px; }
  .barrow .lbl { color: var(--muted); font-size: 12px; text-align: right; }
  .barrow .val { font-size: 12px; color: var(--muted); }
  .tag { display: inline-block; background: #212832; border: 1px solid var(--line);
    border-radius: 6px; padding: 1px 8px; margin: 2px 4px 2px 0; font-size: 12px; }
  .muted { color: var(--muted); }
  .yes { color: var(--high); font-weight: 700; }
  .nores { color: var(--muted); font-style: italic; padding: 8px 0; }
  footer { padding: 20px 32px; color: var(--muted); font-size: 12px;
    border-top: 1px solid var(--line); text-align: center; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>ReconHub Report</h1>
    <div class="sub">Generated {{GENERATED_AT}}</div>
  </div>
</header>
<nav class="toc">
  <div class="wrap">
    <div class="links">
      <a href="#summary">Summary</a>
      <a href="#charts">Charts</a>
      <a href="#findings">Findings</a>
      <a href="#endpoints">Endpoints</a>
      <a href="#parameters">Parameters</a>
      <a href="#js">JS</a>
      <a href="#tech">Tech</a>
    </div>
    <div class="filters">
      <span class="fl">Filter</span>
      <input type="search" id="q" placeholder="Search rows&hellip;" aria-label="Filter table rows">
      <span id="sevfilter">
        <label><input type="checkbox" class="sevbox" value="HIGH" checked> High</label>
        <label><input type="checkbox" class="sevbox" value="MEDIUM" checked> Medium</label>
        <label><input type="checkbox" class="sevbox" value="LOW" checked> Low</label>
        <label><input type="checkbox" class="sevbox" value="INFO" checked> Info</label>
      </span>
    </div>
  </div>
</nav>
<main class="wrap">
{{BODY}}
</main>
<footer>ReconHub &mdash; Burp Suite recon aggregation extension.</footer>
<script>
(function () {
  var q = document.getElementById("q");
  var sevboxes = Array.prototype.slice.call(document.querySelectorAll(".sevbox"));

  function activeSev() {
    var on = {};
    sevboxes.forEach(function (b) { if (b.checked) on[b.value] = true; });
    return on;
  }

  function apply() {
    var term = (q.value || "").toLowerCase();
    var sev = activeSev();
    document.querySelectorAll("table").forEach(function (tbl) {
      var isFindings = tbl.id === "findings-table";
      tbl.querySelectorAll("tbody tr").forEach(function (tr) {
        var show = true;
        if (isFindings) {
          var s = tr.getAttribute("data-sev");
          if (s && !sev[s]) { show = false; }
        }
        if (show && term) { show = tr.textContent.toLowerCase().indexOf(term) !== -1; }
        tr.classList.toggle("hidden", !show);
      });
    });
  }

  q.addEventListener("input", apply);
  sevboxes.forEach(function (b) { b.addEventListener("change", apply); });

  // Collapsible sections (click the heading).
  document.querySelectorAll("section > h2").forEach(function (h) {
    h.addEventListener("click", function () { h.parentNode.classList.toggle("collapsed"); });
  });
})();
</script>
</body>
</html>
